[project]
name = "life-tracker-server"
version = "0.1.0"
description = "Private Life Tracker ingestion API"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.141.1", "uvicorn>=0.52.4"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
